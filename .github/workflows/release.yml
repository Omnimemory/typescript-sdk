name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:generated
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify tag and package version
        run: |
          test "$(git describe --exact-match --tags)" = "v${{ inputs.version }}"
          test "$(node -p \"require('./package.json').version\")" = "${{ inputs.version }}"
      - run: npm publish --provenance
